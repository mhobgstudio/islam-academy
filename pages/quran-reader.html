<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Reader — Islam Academy</title>
<link rel="stylesheet" href="../assets/css/academy.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
/* === RESPONSIVE FIX (auto-injected) === */
@media (max-width: 768px) {
  /* Prevent horizontal overflow on body */
  body, html { max-width: 100vw; overflow-x: hidden; }
  
  /* Tables scroll horizontally instead of overflowing */
  table { max-width: 100%; overflow-x: auto; display: block; }
  
  /* Grain overlays — constrain to viewport */
  .grain-overlay { width: 100vw !important; max-width: 100vw !important; left: 0 !important; right: 0 !important; }
  
  /* Chat pages — make responsive */
  .chat_page, .page_body { max-width: 100vw !important; width: 100% !important; }
  .content { max-width: 100vw !important; width: 100% !important; }
  .history { max-width: 100% !important; }
  .message { max-width: 100% !important; word-wrap: break-word; overflow-wrap: break-word; }
  .body { max-width: 100% !important; }
  .media.clearfix { max-width: 100% !important; }
  
  /* Nebula/glows — constrain */
  .nebula, .glow { max-width: 100vw !important; }
  
  /* Orb animations — constrain */
  .orb { max-width: 100vw !important; }
  
  /* Larger touch targets */
  a, button, input, select, textarea, [role="button"], [onclick] {
    min-height: 44px;
    min-width: 44px;
  }
  
  /* Fix small text */
  body { font-size: max(14px, inherit); }
  
  /* Chips/buttons wrap */
  .chips { flex-wrap: wrap !important; overflow: hidden !important; }
  .chip { flex-shrink: 1 !important; }
  
  /* Reminder bars — constrain */
  .due-date-reminder { max-width: 100vw !important; width: 100% !important; left: 0 !important; right: 0 !important; }
  
  /* Timer/countdown blocks */
  .timer, .timer-unit, .moon-countdown { max-width: 100% !important; }
  
  /* KPI tables, data tables */
  .kpi-table, .cyber-table, .org-table, .bp-table, .ptrack { max-width: 100% !important; overflow-x: auto; display: block; }
  
  /* Notebook/book pages */
  .page.cover, .page { max-width: 100% !important; width: 100% !important; }
  
  /* Tape tracks — hide overflow on mobile */
  .tape-track { overflow: hidden !important; }
  
  /* Banner/topbar */
  .topbar-right { max-width: 100% !important; flex-wrap: wrap; }
}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner">
  <a class="brand" href="../index.html"><div class="brand-mark">ق</div>
  <div class="brand-name">Islam Academy<small>Arabic · Quran · Tajweed</small></div></a>
  <nav class="nav" id="main-nav"></nav>
</div></header>

<main class="container">
  <h1 class="page-title">📖 Quran Reader</h1>
  <p class="page-sub">Read the Noble Quran in Uthmani script with Saheeh International translation. Tap any word for meaning and audio.</p>

  <div class="reader-toolbar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">
    <select id="surah-select" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:var(--paper);min-width:180px"></select>
    <select id="reciter-select" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:var(--paper)">
      <option value="ar.alafasy">Mishary Alafasy</option>
      <option value="ar.abdulbasit">Abdul Basit (Murattal)</option>
      <option value="ar.husary">Mahmoud Khalil Husary</option>
      <option value="ar.minshawi">Mohamed Siddiq El-Minshawi</option>
    </select>
    <div style="display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden" id="text-mode-toggle">
      <button class="btn small" data-mode="uthmani" style="border-radius:0;border:none;border-right:1px solid var(--line);background:var(--gold);color:#fff">Uthmani</button>
      <button class="btn small ghost" data-mode="clean" style="border-radius:0;border:none;border-right:1px solid var(--line)">Clean</button>
      <button class="btn small ghost" data-mode="standard" style="border-radius:0;border:none">Standard</button>
    </div>
    <button class="btn small" id="play-surah-btn">🔊 Play Surah</button>
  </div>

  <div class="card" id="surah-info" style="margin-bottom:16px;display:none">
    <h3 id="surah-name"></h3>
    <p class="sub" id="surah-meta"></p>
  </div>

  <div id="ayah-container"></div>
</main>

<footer class="site-footer">Islam Academy — Quran Reader</footer>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  });
}
</script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
(async function () {
  const { el, speakArabic, ayahAudio } = Academy;

  const CACHE_KEY = 'quran-data-v2';
  let quranText, quranTrans, surahMeta;
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      quranText = parsed.uthmani;
      quranTrans = parsed.translation;
      surahMeta = parsed.meta;
    } else {
      [quranText, quranTrans, surahMeta] = await Promise.all([
        Academy.fetchJSON("../data/quran/uthmani.json"),
        Academy.fetchJSON("../data/quran/translation_en.json"),
        Academy.fetchJSON("../data/quran/surah_meta.json"),
      ]);
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ uthmani: quranText, translation: quranTrans, meta: surahMeta }));
      } catch(e) { /* quota exceeded — fine, will refetch next time */ }
    }
  } catch(e) {
    document.getElementById("ayah-container").innerHTML = '<div class="card"><p class="sub">Could not load Quran data. Serve via HTTP not file://.</p></div>';
    return;
  }

  // Populate surah select
  const sel = document.getElementById("surah-select");
  surahMeta.forEach(s => {
    sel.append(el("option", {value: s.number}, s.number + ". " + s.name + " — " + s.ayahs + " ayat"));
  });

  // Parse URL params
  const params = new URLSearchParams(location.search);
  if (params.get("surah")) sel.value = params.get("surah");

  let currentSurah = parseInt(sel.value) || 1;
  let audioPlayer = new Audio();
  let currentPlaying = null;
  let surahQueue = null; // [ayahNum, ...] for sequential playback
  let textMode = 'uthmani'; // 'uthmani' | 'clean' | 'standard'

  // --- Text transformation functions ---
  // Strip all Arabic diacritics/tashkeel (U+0610-U+065F, U+0670, U+06D6-U+06DC, U+06DF-U+06E4, U+06E7-U+06E8, U+06EA-U+06ED, U+0610-U+061A, U+064B-U+065F, U+0670, U+06D6-U+06DC, U+06DF-U+06E4, U+06E7-U+06E8, U+06EA-U+06ED)
  function stripDiacritics(text) {
    return text.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06E4\u06E7-\u06E8\u06EA-\u06ED\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06E8\u06EA-\u06ED]/g, '');
  }
  // Clean: strip diacritics only
  function toClean(text) {
    return stripDiacritics(text);
  }
  // Standard: strip diacritics AND normalize special Uthmani glyphs
  function toStandard(text) {
    let t = stripDiacritics(text);
    // Normalize hamzat wasl (ٱ -> ا), small alef, etc.
    t = t.replace(/\u0671/g, '\u0627'); // alef wasla -> alef
    t = t.replace(/\u06E5/g, '\u0648'); // small waw -> waw
    t = t.replace(/\u06E6/g, '\u064A'); // small ya -> ya
    t = t.replace(/\u06E7/g, '\u064A'); // small high ya -> ya
    t = t.replace(/\u06E8/g, '\u0646'); // small high nun -> nun
    t = t.replace(/\u06ED/g, '\u0645'); // small low meem -> meem
    t = t.replace(/\u0622/g, '\u0627'); // alef madda -> alef
    t = t.replace(/\u0623/g, '\u0627'); // alef with hamza above -> alef
    t = t.replace(/\u0625/g, '\u0627'); // alef with hamza below -> alef
    t = t.replace(/\u0629/g, '\u0647'); // ta marbuta -> ha
    return t;
  }
  function transformText(text) {
    if (textMode === 'clean') return toClean(text);
    if (textMode === 'standard') return toStandard(text);
    return text; // uthmani
  }
  function renderTextModeButtons() {
    document.querySelectorAll('#text-mode-toggle button').forEach(btn => {
      const isActive = btn.dataset.mode === textMode;
      btn.className = isActive ? 'btn small' : 'btn small ghost';
      if (isActive) {
        btn.style.background = 'var(--gold)';
        btn.style.color = '#fff';
      } else {
        btn.style.background = '';
        btn.style.color = '';
      }
    });
  }
  document.getElementById('text-mode-toggle').addEventListener('click', function(e) {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    textMode = btn.dataset.mode;
    renderTextModeButtons();
    renderSurah(currentSurah);
  });

  function highlightCard(card, playing) {
    if (currentPlaying && currentPlaying !== card) {
      currentPlaying.style.borderColor = "";
      currentPlaying.style.background = "";
    }
    currentPlaying = playing ? card : null;
  }

  function playAyah(ayahNum, card) {
    audioPlayer.pause();
    surahQueue = null; // single ayah stops sequential playback
    audioPlayer.src = ayahAudio(document.getElementById("reciter-select").value, ayahNum);
    audioPlayer.play().catch(() => {});
    if (card) {
      highlightCard(card, true);
      card.style.borderColor = "var(--gold)";
      card.style.background = "color-mix(in srgb, var(--gold) 5%, transparent)";
    }
  }

  function playNextInQueue(reciter) {
    if (!surahQueue || surahQueue.length === 0) {
      highlightCard(null, false);
      return;
    }
    const ayahNum = surahQueue.shift();
    audioPlayer.src = ayahAudio(reciter, ayahNum);
    audioPlayer.play().catch(() => {});
    const card = document.querySelector(`[data-ayah="${ayahNum}"]`);
    if (card) {
      highlightCard(card, true);
      card.style.borderColor = "var(--gold)";
      card.style.background = "color-mix(in srgb, var(--gold) 5%, transparent)";
    }
  }

  function playSurah() {
    const reciter = document.getElementById("reciter-select").value;
    let globalStart = 1;
    for (let i = 0; i < currentSurah - 1; i++) globalStart += surahMeta[i].ayahs;
    const count = surahMeta[currentSurah - 1].ayahs;
    surahQueue = Array.from({length: count}, (_, i) => globalStart + i);
    audioPlayer.pause();
    playNextInQueue(reciter);
  }

  function renderSurah(num) {
    currentSurah = num;
    surahQueue = null;
    const info = surahMeta[num - 1];
    const container = document.getElementById("ayah-container");
    container.innerHTML = "";

    // Surah info
    const infoCard = document.getElementById("surah-info");
    infoCard.style.display = "";
    document.getElementById("surah-name").textContent = info.name + " — Surah " + info.number;
    document.getElementById("surah-meta").textContent = info.revelation.charAt(0).toUpperCase() + info.revelation.slice(1) + " • " + info.ayahs + " ayat";

    // Calculate global ayah start
    let globalStart = 1;
    for (let i = 0; i < num - 1; i++) globalStart += surahMeta[i].ayahs;

    // Bismillah
    if (num === 1) {
      // Fatiha: bismillah is already ayah 1 in the data, no extra card needed
    } else if (num === 9) {
      // At-Tawbah: no bismillah — show hadith reference
      const hadithCard = el("div", {class:"card", style:"text-align:center;margin-bottom:12px;padding:20px;border-left:3px solid var(--gold)"},
        el("div", {style:"font-size:22px;color:var(--gold);margin-bottom:6px"}, "بِسْمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ"),
        el("div", {style:"font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.6;max-width:560px;margin-left:auto;margin-right:auto"},
          el("strong", null, "Why is there no Basmalah here?"),
          el("p", {style:"margin:6px 0 0"}, "Surah At-Tawbah is the only surah of the Quran that does not begin with the Basmalah. According to the earliest authorities, this surah was originally connected to Surah Al-Anfal (8), as one continuous revelation. The great reciter Qatadah (d. 735 CE) explained that it was separated because of the severity of its content — a stern warning against the hypocrites who betrayed the believers."),
          el("p", {style:"margin:6px 0 0;font-style:italic"}, 'Ibn Abbas reported: "The Prophet (\u{FDF2}) used to recite Surah Al-Anfal and Surah Bara\u2019ah together." — Sahih al-Bukhari 4969')
        )
      );
      container.append(hadithCard);
    } else {
      const bCard = el("div", {class:"card", style:"text-align:center;margin-bottom:12px;padding:20px"},
        el("div", {class:"quran-text", style:"font-size:28px"}, transformText(ayat[0] || "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ")),
        el("div", {style:"font-size:12px;color:var(--ink-soft);margin-top:4px"}, "In the name of Allah, the Most Gracious, the Most Merciful"),
        el("button", {class:"btn small ghost", style:"margin-top:8px", onclick: function() {
          speakArabic("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", this);
        }}, "🔊 Listen")
      );
      container.append(bCard);
    }

    // Ayat
    const ayat = (quranText[num] || []).map(a => typeof a === 'object' ? a.t : a);
    const trans = (quranTrans[num] || []).map(a => typeof a === 'object' ? a.t : a);
    ayat.forEach((text, i) => {
      const ayahNum = globalStart + i;
      const card = el("div", {
        class: "card",
        style: "margin-bottom:10px;padding:16px;cursor:pointer",
        "data-ayah": ayahNum,
      });

      const playBtn = el("button", {
        class: "btn small",
        style: "flex-shrink:0",
        onclick: function(e) {
          e.stopPropagation();
          playAyah(ayahNum, card);
        }
      }, "🔊");

      card.appendChild(el("div", {style:"display:flex;justify-content:space-between;align-items:flex-start;gap:12px"},
        el("div", {class:"quran-text", style:"font-size:22px;flex:1;line-height:1.8", lang:"ar"}, transformText(text)),
        el("div", {style:"display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0"},
          el("span", {style:"font-size:11px;color:var(--gold);background:var(--cream);padding:2px 8px;border-radius:12px;white-space:nowrap"}, String(i + 1)),
          playBtn
        )
      ));
      card.appendChild(el("div", {style:"font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.6"}, trans[i] || ""));
      card.addEventListener("click", function() { playAyah(ayahNum, card); });
      container.append(card);
    });

    // Play surah button — plays full surah in sequence
    document.getElementById("play-surah-btn").onclick = playSurah;

    audioPlayer.onended = function() {
      if (surahQueue && surahQueue.length > 0) {
        playNextInQueue(document.getElementById("reciter-select").value);
      } else {
        highlightCard(null, false);
      }
    };
  }

  sel.addEventListener("change", () => renderSurah(parseInt(sel.value)));
  renderSurah(currentSurah);
})();
</script>
</body>
</html>
