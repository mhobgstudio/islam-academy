<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Reader — Islam Academy</title>
<link rel="stylesheet" href="../assets/css/academy.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  .ayah-ar { font-size: 32px; }
  @media (max-width:600px){ .ayah-ar { font-size: 26px; } }
</style>
</head>
<body>
<header class="site-header"><div class="header-inner">
  <a class="brand" href="../index.html"><div class="brand-mark">ق</div>
  <div class="brand-name">Islam Academy<small>Arabic · Quran · Tajweed</small></div></a>
  <nav class="nav" id="main-nav"></nav>
</div></header>

<main class="container">
  <h1 class="page-title">📖 Quran Reader</h1>
  <p class="page-sub">Uthmani script · Saheeh International translation · tap any word for instant meaning &amp; audio.</p>

  <div class="reader-toolbar">
    <select id="surah-select"></select>
    <button class="btn small" id="play-surah">▶ Recite surah</button>
    <button class="btn small ghost" id="stop-audio">■ Stop</button>
    <label style="font-size:13px;display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="show-trans" checked> translation
    </label>
    <select id="reciter">
      <option value="ar.alafasy">Mishary Alafasy</option>
      <option value="ar.abdulbasitmurattal">Abdul Basit (murattal)</option>
      <option value="ar.husary">Mahmoud Khalil Al-Husary</option>
      <option value="ar.minshawi">Mohamed Al-Minshawi</option>
      <option value="ar.muhammadsiddiqalminshawi">Al-Minshawi (children)</option>
    </select>
  </div>

  <div id="reader"></div>
</main>

<footer class="site-footer">Text: Tanzil Uthmani · Translation: Saheeh International · Audio: islamic.network CDN + quran.com wbw</footer>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
(async function () {
  const { el } = Academy;
  const [uthmani, trans, meta, words, rootsDict] = await Promise.all([
    Academy.fetchJSON("../data/quran/uthmani.json"),
    Academy.fetchJSON("../data/quran/translation_en.json"),
    Academy.fetchJSON("../data/quran/surah_meta.json"),
    Academy.fetchJSON("../data/quran/words.json"),
    Academy.fetchJSON("../data/quran/roots.json").catch(()=>({})),
  ]);

  // Build inverted index: root -> [{ar, meaning, pattern}, ...]
  const rootIndex = {};
  Object.entries(rootsDict).forEach(([ar, data]) => {
    if (data && data.root) {
      if (!rootIndex[data.root]) rootIndex[data.root] = [];
      rootIndex[data.root].push({ ar, meaning: data.meaning, pattern: data.pattern });
    }
  });
  const sel = document.getElementById("surah-select");
  const reader = document.getElementById("reader");
  const showTrans = document.getElementById("show-trans");
  const reciterSel = document.getElementById("reciter");

  // global ayah number lookup: cumulative
  const globalNum = {};
  let g = 1;
  meta.forEach(m => { globalNum[m.number] = g; g += m.ayahs; });

  meta.forEach(m => {
    const o = el("option", {value:m.number}, m.number + ". " + m.name + " (" + m.ayahs + ")");
    sel.append(o);
  });

  const params = new URLSearchParams(location.search);
  const initial = parseInt(params.get("surah") || "1", 10);
  sel.value = String(initial);

  let playQueue = [], playing = false;
  const player = new Audio();

  function stopAll() { player.pause(); playQueue = []; playing = false; }

  document.getElementById("stop-audio").onclick = stopAll;

  document.getElementById("play-surah").onclick = () => {
    const s = parseInt(sel.value, 10);
    playQueue = uthmani[s].map(v => v.v);
    playing = true;
    playNext(s);
  };
  function playNext(s) {
    if (!playing || playQueue.length === 0) { stopAll(); return; }
    const v = playQueue.shift();
    const url = Academy.ayahAudio(reciterSel.value, globalNum[s] + v - 1);
    player.src = url;
    player.play().catch(()=>{});
    player.onended = () => playNext(s);
  }

  // Strip Arabic diacritics and normalize for root lookup
  function stripArabic(s) {
    return s.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
      .replace(/\u0671/g, '\u0627')
      .replace(/[\u0622\u0623\u0625]/g, '\u0627')
      .replace(/\u0629/g, '\u0647')
      .replace(/\u0649/g, '\u064A')
      .replace(/\u0621/g, '')
      .replace(/\u0624/g, '\u0648')
      .replace(/\u0626/g, '\u064A')
      .trim();
  }

  function lookupRoot(arabic) {
    const stripped = stripArabic(arabic);
    if (rootsDict[stripped]) return rootsDict[stripped];
    const noArticle = stripped.replace(/^\u0627\u0644/, '');
    if (noArticle !== stripped && rootsDict[noArticle]) return rootsDict[noArticle];
    return null;
  }

  function renderPopover(anchor, w) {
    document.querySelectorAll(".word-popover").forEach(p=>p.remove());
    const rootData = lookupRoot(w.u);
    const children = [
      el("div", {class:"w-ar"}, w.u),
      el("div", null, w.tr),
      w.tl ? el("div", {class:"w-tl"}, w.tl) : null,
    ];
    if (rootData && rootData.root) {
      const rootParts = rootData.root.split(".");
      const colors = ["#dc2626", "#2563eb", "#16a34a"];
      const rootCircles = rootParts.map((r, i) =>
        el("span", {style:"display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;font-size:15px;font-weight:700;margin:0 2px;color:#fff;background:" + colors[i], title: ['1st (\u0641)', '2nd (\u0639)', '3rd (\u0644)'][i]}, r)
      );
      // Reverse root circles for RTL (1st root letter on right)
      const rtlCircles = [...rootCircles].reverse();
      children.push(el("div", {class:"root-decomp", style:"margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15)"},
        el("div", {class:"root-label", style:"font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin-bottom:4px"}, "\u062c\u0630\u0631 (root)"),
        el("div", {style:"display:flex;flex-direction:row-reverse;align-items:center;gap:6px;justify-content:center"},
          el("div", {style:"display:flex;flex-direction:row-reverse;gap:3px"}, ...rtlCircles),
          el("span", {style:"font-size:10px;opacity:.7"}, rootData.pattern || '')
        ),
        rootData.meaning ? el("div", {class:"root-meaning", style:"font-size:11px;opacity:.7;margin-top:4px;font-style:italic"}, rootData.meaning) : null
      ));
      // Related words from same root
      const siblings = (rootIndex[rootData.root] || []).filter(s => s.ar !== stripArabic(w.u));
      if (siblings.length > 0) {
        const chips = siblings.slice(0, 8).map(s =>
          el("span", {class:"ar", style:"display:inline-block;padding:2px 8px;margin:2px;border-radius:6px;background:rgba(255,255,255,.1);font-size:14px;direction:rtl;unicode-bidi:embed", title: s.meaning}, s.ar)
        );
        children.push(el("div", {style:"margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.15)"},
          el("div", {style:"font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin-bottom:4px"}, "\u0625\u0634\u062a\u0642\u0627\u0642 (related)"),
          el("div", {style:"display:flex;flex-wrap:wrap;gap:2px;justify-content:center"}, ...chips),
          siblings.length > 8 ? el("div", {style:"font-size:10px;opacity:.5;margin-top:2px"}, "+" + (siblings.length - 8) + " more") : null
        ));
      }
    }
    if (w.au) children.push(el("button", {class:"btn small gold", style:"margin-top:8px",
      onclick:(e)=>{e.stopPropagation(); Academy.speak(Academy.wbwAudio(w.au));}}, "🔊 listen"));
    const pop = el("div", {class:"word-popover"}, ...children);
    const rect = anchor.getBoundingClientRect();
    pop.style.top = (window.scrollY + rect.bottom + 6) + "px";
    pop.style.left = Math.max(10, window.scrollX + rect.left - 60) + "px";
    document.body.append(pop);
    setTimeout(()=>document.addEventListener("click", function rm(){ pop.remove(); document.removeEventListener("click", rm); }), 50);
  }

  async function loadSurah() {
    stopAll();
    const s = parseInt(sel.value, 10);
    location.hash = "";
    history.replaceState(null, "", "?surah=" + s);
    reader.innerHTML = "";
    const info = meta[s-1];
    reader.append(el("p", {style:"text-align:center;color:var(--ink-soft);font-size:13px;margin-bottom:16px"},
      "Surah " + info.name + " · " + info.revelation + " · " + info.ayahs + " ayat"));
    const wbwSurah = words[String(s)] || {};

    uthmani[s].forEach((v, i) => {
      const t = trans[s][i];
      const card = el("div", {class:"ayah-card"});
      const head = el("div", {class:"ayah-head"},
        el("span", {class:"ayah-num"}, s + ":" + v.v),
        el("button", {class:"speaker-btn", title:"Recite this ayah",
          onclick:(e)=>{ e.stopPropagation(); Academy.speak(Academy.ayahAudio(reciterSel.value, globalNum[s] + v.v - 1), e.currentTarget); }}, "🔊"),
        el("div", {style:"flex:1"}));
      card.append(head);

      const arDiv = el("div", {class:"ayah-ar quran-text"});
      const wbwWords = (wbwWordsFor(wbwSurah, v.v)) || [];
      if (wbwWords.length > 0) {
        wbwWords.forEach(w => {
          arDiv.append(el("span", {class:"word-chip", onclick:(e)=>{
            renderPopover(e.currentTarget, w);
            if (w.au) Academy.speak(Academy.wbwAudio(w.au));
          }}, w.u), " ");
        });
      } else {
        arDiv.append(el("span", {class:"word-chip"}, v.t));
      }
      card.append(arDiv);

      if (wbwWords.length > 0 && Academy.state.settings.translit !== false) {
        const tlLine = el("div", {style:"font-size:12.5px;color:var(--gold-500);margin-top:4px;text-align:right;direction:ltr"},
          wbwWords.map(w => w.tl).filter(Boolean).join(" · "));
        card.append(tlLine);
      }

      const trEl = el("div", {class:"ayah-trans"}, t.t);
      trEl.style.display = showTrans.checked ? "" : "none";
      card.append(trEl);
      reader.append(card);
    });
  }

  function wbwWordsFor(wbwSurah, vnum) {
    return wbwSurah[String(vnum)];
  }

  sel.onchange = loadSurah;
  showTrans.onchange = () => {
    document.querySelectorAll(".ayah-trans").forEach(t =>
      t.style.display = showTrans.checked ? "" : "none");
  };
  reciterSel.onchange = () => {
    try {
      const st = JSON.parse(localStorage.getItem("islam-academy-v1"));
      st.settings.reciter = reciterSel.value;
      localStorage.setItem("islam-academy-v1", JSON.stringify(st));
    } catch(e){}
  };
  try { reciterSel.value = JSON.parse(localStorage.getItem("islam-academy-v1")).settings.reciter || "ar.alafasy"; } catch(e){}

  loadSurah();
})();
</script>
</body>
</html>
