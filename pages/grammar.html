<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lessons — Islam Academy</title>
<link rel="stylesheet" href="../assets/css/academy.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
/* === RESPONSIVE FIX (auto-injected) === */
@media (max-width: 768px) {
  /* Prevent horizontal overflow on body */
  body, html { max-width: 100vw; overflow-x: hidden; }
  
  /* Tables scroll horizontally instead of overflowing */
  table { max-width: 100%; overflow-x: auto; display: block; }
  
  /* Grain overlays — constrain to viewport */
  .grain-overlay { width: 100vw !important; max-width: 100vw !important; left: 0 !important; right: 0 !important; }
  
  /* Chat pages — make responsive */
  .chat_page, .page_body { max-width: 100vw !important; width: 100% !important; }
  .content { max-width: 100vw !important; width: 100% !important; }
  .history { max-width: 100% !important; }
  .message { max-width: 100% !important; word-wrap: break-word; overflow-wrap: break-word; }
  .body { max-width: 100% !important; }
  .media.clearfix { max-width: 100% !important; }
  
  /* Nebula/glows — constrain */
  .nebula, .glow { max-width: 100vw !important; }
  
  /* Orb animations — constrain */
  .orb { max-width: 100vw !important; }
  
  /* Larger touch targets */
  a, button, input, select, textarea, [role="button"], [onclick] {
    min-height: 44px;
    min-width: 44px;
  }
  
  /* Fix small text */
  body { font-size: max(14px, inherit); }
  
  /* Chips/buttons wrap */
  .chips { flex-wrap: wrap !important; overflow: hidden !important; }
  .chip { flex-shrink: 1 !important; }
  
  /* Reminder bars — constrain */
  .due-date-reminder { max-width: 100vw !important; width: 100% !important; left: 0 !important; right: 0 !important; }
  
  /* Timer/countdown blocks */
  .timer, .timer-unit, .moon-countdown { max-width: 100% !important; }
  
  /* KPI tables, data tables */
  .kpi-table, .cyber-table, .org-table, .bp-table, .ptrack { max-width: 100% !important; overflow-x: auto; display: block; }
  
  /* Notebook/book pages */
  .page.cover, .page { max-width: 100% !important; width: 100% !important; }
  
  /* Tape tracks — hide overflow on mobile */
  .tape-track { overflow: hidden !important; }
  
  /* Banner/topbar */
  .topbar-right { max-width: 100% !important; flex-wrap: wrap; }
}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner">
  <a class="brand" href="../index.html"><div class="brand-mark">ق</div>
  <div class="brand-name">Islam Academy<small>Arabic · Quran · Tajweed</small></div></a>
  <nav class="nav" id="main-nav"></nav>
</div></header>

<main class="container">
  <h1 class="page-title">📘 Lessons</h1>
  <p class="page-sub">Four levels, Madinah-method progression. Each lesson: read → drill → pass the quiz (70%+ to complete).</p>
  <div id="level-tabs" class="reader-toolbar"></div>
  <div id="lesson-list"></div>
  <div id="lesson-view"></div>
</main>

<footer class="site-footer">Islam Academy — Curriculum</footer>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
(async function () {
  const { el } = Academy;
  let levels;
  try {
    levels = await Academy.fetchJSON("../data/curriculum/levels.json");
  } catch(e) {
    document.getElementById("lesson-view").innerHTML = '<div class="card"><p class="sub">Could not load lessons. Serve this site via HTTP (python3 -m http.server) not file://.</p></div>';
    return;
  }
  const tabs = document.getElementById("level-tabs");
  const list = document.getElementById("lesson-list");
  const view = document.getElementById("lesson-view");
  let currentLevel = new URLSearchParams(location.search).get("level") || "0";

  Object.entries(levels).forEach(([num, lv]) => {
    const b = el("button", {class:"btn small ghost", onclick:()=>{currentLevel=num; renderList();}}, "Level " + num + " — " + lv.title);
    b.dataset.level = num;
    tabs.append(b);
  });

  function renderList() {
    tabs.querySelectorAll("button").forEach(b => {
      const active = b.dataset.level === currentLevel;
      b.classList.toggle("gold", active);
      b.classList.toggle("ghost", !active);
    });
    list.innerHTML = ""; view.innerHTML = "";
    levels[currentLevel].lessons.forEach(L => {
      const score = Academy.lessonScore(L.id);
      const row = el("div", {class:"lesson-row"},
        el("div", null, el("div", {class:"t"}, L.id + " — " + L.title),
          el("div", {class:"d"}, "~" + L.minutes + " min · " + (L.drills ? L.drills.length : 0) + " exercises")),
        el("div", {class:"grow"}),
        score != null ? el("span", {class:"badge done"}, "✓ " + score + "%") : el("span", {class:"badge"}, "new"),
        el("button", {class:"btn small", onclick:()=>openLesson(L)}, "Open"));
      list.append(row);
    });
  }

  function openLesson(L) {
    list.style.display = "none";
    view.innerHTML = "";
    const back = el("button", {class:"btn ghost small", onclick:()=>{view.innerHTML=""; list.style.display=""; renderList();}}, "← All lessons");
    const head = el("div", {style:"margin-bottom:18px"}, back,
      el("h2", {class:"page-title", style:"margin-top:12px"}, L.id + " — " + L.title));

    const explain = el("div", {class:"card explain", style:"margin-bottom:16px"});
    (L.explain || []).forEach(p => explain.append(el("p", null, p)));
    if (L.link) explain.append(el("a", {class:"btn small gold", href:L.link}, "Practice in Quran Reader →"));

    view.append(head, explain);

    if (L.interactive) {
      const kind = L.interactive.kind;
      if (kind === "alphabet") {
        view.append(el("div", {class:"card", style:"margin-bottom:16px"},
          el("p", {class:"sub"}, "Quick reference — click to hear each letter."),
          el("a", {class:"btn small", href:"alphabet.html"}, "Open Alphabet Trainer →")));
      } else if (kind === "root-explorer") {
        view.append(renderRootExplorer());
      } else if (kind === "prefix-drill") {
        view.append(renderPrefixDrill());
      } else if (kind === "suffix-chart") {
        view.append(renderSuffixChart());
      }
    }

    function renderRootExplorer() {
      const roots = [
        {letters:"ك-ت-ب", meaning:"Writing", words:[
          {ar:"كِتَاب",en:"book",pattern:"فِعَال"},{ar:"كَاتِب",en:"writer",pattern:"فَاعِل"},
          {ar:"كَتَبَ",en:"he wrote",pattern:"فَعَلَ"},{ar:"مَكْتَبَة",en:"library",pattern:"مَفْعَلَة"},
          {ar:"مَكْتُوب",en:"written",pattern:"مَفْعُول"}
        ]},
        {letters:"ع-ل-م", meaning:"Knowledge", words:[
          {ar:"عِلْم",en:"knowledge",pattern:"فِعْل"},{ar:"عَالِم",en:"scholar",pattern:"فَاعِل"},
          {ar:"مَعْلُوم",en:"known",pattern:"مَفْعُول"},{ar:"تَعْلِيم",en:"education",pattern:"تَفْعِيل"}
        ]},
        {letters:"ر-ح-م", meaning:"Mercy", words:[
          {ar:"رَحْمَة",en:"mercy",pattern:"فَعْلَة"},{ar:"رَحِيم",en:"merciful",pattern:"فَعِيل"},
          {ar:"رَحَمَ",en:"he had mercy",pattern:"فَعَلَ"},{ar:"مَرْحَم",en:"place of mercy",pattern:"مَفْعَل"}
        ]},
        {letters:"س-ل-م", meaning:"Peace/Safety", words:[
          {ar:"سَلَام",en:"peace",pattern:"فَعَال"},{ar:"إِسْلَام",en:"Islam",pattern:"إِفْعَال"},
          {ar:"مُسْلِم",en:"Muslim",pattern:"مُفْعِل"},{ar:"سَلِيم",en:"safe",pattern:"فَعِيل"}
        ]},
        {letters:"ف-ت-ح", meaning:"Opening/Victory", words:[
          {ar:"فَتْح",en:"opening",pattern:"فَعْل"},{ar:"فَاتِحَة",en:"opening chapter",pattern:"فَاعِلَة"},
          {ar:"فَتَحَ",en:"he opened",pattern:"فَعَلَ"}
        ]},
        {letters:"ق-ر-أ", meaning:"Reading", words:[
          {ar:"قِرَاءَة",en:"reading",pattern:"فِعَالَة"},{ar:"قَارِئ",en:"reader",pattern:"فَاعِل"},
          {ar:"قَرَأَ",en:"he read",pattern:"فَعَلَ"},{ar:"مَقْرَأ",en:"reading place",pattern:"مَفْعَل"}
        ]}
      ];
      const card = el("div", {class:"card", style:"margin-bottom:16px"});
      card.append(el("h3", null, "🔍 Root Explorer — Try It!"));
      card.append(el("p", {class:"sub"}, "Click a root to see all its word family. 🔊 to hear each word."));
      const grid = el("div", {style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px"});
      const detail = el("div", {style:"margin-top:16px;padding:16px;background:var(--cream);border-radius:12px;display:none"});
      function showRoot(r) {
        detail.style.display = "";
        detail.innerHTML = "";
        detail.append(
          el("h4", {class:"ar", style:"font-size:24px;text-align:center;margin-bottom:4px"}, r.letters),
          el("p", {style:"text-align:center;color:var(--gold-500);margin-bottom:12px"}, "Root meaning: " + r.meaning)
        );
        r.words.forEach(function(w) {
          detail.append(el("div", {style:"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"},
            el("span", {class:"ar", style:"font-size:20px"}, w.ar),
            el("span", {style:"font-size:13px;color:var(--ink-soft)"}, w.en),
            el("span", {class:"badge", style:"font-size:10px"}, w.pattern),
            Academy.speakerBtn(w.ar)
          ));
        });
      }
      roots.forEach(function(root) {
        var card2 = el("div", {class:"card", style:"cursor:pointer;text-align:center;padding:16px"});
        card2.onclick = function() { showRoot(root); };
        card2.append(
          el("div", {class:"ar", style:"font-size:24px;margin-bottom:4px"}, root.letters.replace(/-/g," ")),
          el("div", {style:"font-size:13px;color:var(--ink-soft)"}, root.meaning),
          el("div", {style:"font-size:11px;color:var(--gold-500);margin-top:4px"}, root.words.length + " words"),
          el("button", {class:"btn small ghost", style:"margin-top:6px",
            onclick: (e) => { e.stopPropagation(); Academy.speakArabic(root.words.map(w=>w.ar).join(" ، "), e.currentTarget); }
          }, "🔊 all")
        );
        grid.append(card2);
      });
      card.append(grid, detail);
      return card;
    }

    function renderPrefixDrill() {
      const prefixes = [
        {prefix:"الـ",meaning:"THE (definite article)",example:"الْكِتَابُ = the book",color:"var(--emerald-700)"},
        {prefix:"بِ",meaning:"with / by / in",example:"بِالْكِتَابِ = with the book",color:"var(--gold-500)"},
        {prefix:"لِ",meaning:"for / to",example:"لِلَّهِ = for God",color:"var(--emerald-600)"},
        {prefix:"كَ",meaning:"like / as",example:"كَالشَّمْسِ = like the sun",color:"var(--gold-400)"},
        {prefix:"وَ",meaning:"and",example:"وَالْكِتَابُ = and the book",color:"var(--emerald-700)"},
        {prefix:"فَ",meaning:"then / so",example:"فَذَهَبَ = then he went",color:"var(--gold-500)"},
        {prefix:"سـ",meaning:"will (future)",example:"سَيَذْهَبُ = he will go",color:"var(--emerald-600)"},
        {prefix:"أَ",meaning:"I (present verb)",example:"أَكْتُبُ = I write",color:"var(--gold-400)"},
        {prefix:"يَ",meaning:"he (present verb)",example:"يَكْتُبُ = he writes",color:"var(--emerald-700)"},
        {prefix:"نَ",meaning:"we (present verb)",example:"نَكْتُبُ = we write",color:"var(--gold-500)"},
        {prefix:"مَا",meaning:"not (past negation)",example:"مَا كَتَبَ = he didn't write",color:"var(--emerald-600)"},
        {prefix:"لَمْ",meaning:"did not",example:"لَمْ يَكْتُبْ = he didn't write",color:"var(--gold-400)"},
        {prefix:"لَنْ",meaning:"will not",example:"لَنْ يَكْتُبَ = he won't write",color:"var(--emerald-700)"}
      ];
      const card = el("div", {class:"card", style:"margin-bottom:16px"});
      card.append(el("h3", null, "📌 Prefix Reference Chart"));
      card.append(el("p", {class:"sub"}, "All common Arabic prefixes at a glance."));
      const grid = el("div", {style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px"});
      prefixes.forEach(p => {
        grid.append(el("div", {style:`padding:14px;border-radius:12px;border-left:4px solid ${p.color};background:var(--paper)`},
          el("div", {class:"ar", style:"font-size:28px;margin-bottom:4px"}, p.prefix),
          el("div", {style:"font-weight:700;font-size:14px"}, p.meaning),
          el("div", {style:"display:flex;align-items:center;gap:6px;margin-top:4px"},
            el("div", {class:"ar", style:"font-size:14px;color:var(--gold-500);direction:rtl"}, p.example),
            el("button", {class:"btn small ghost", style:"padding:2px 6px;font-size:12px",
              onclick: (e) => { e.stopPropagation(); Academy.speakArabic(p.example.split("=")[0].trim(), e.currentTarget); }
            }, "🔊")
          )
        ));
      });
      card.append(grid);
      return card;
    }

    function renderSuffixChart() {
      const possessive = [
        {suffix:"ـي",meaning:"my",example:"كِتَابِي = my book"},
        {suffix:"ـكَ",meaning:"your (m)",example:"كِتَابُكَ = your book"},
        {suffix:"ـكِ",meaning:"your (f)",example:"كِتَابُكِ = your book"},
        {suffix:"ـهُ",meaning:"his",example:"كِتَابُهُ = his book"},
        {suffix:"ـهَا",meaning:"her",example:"كِتَابُهَا = her book"},
        {suffix:"ـنَا",meaning:"our",example:"كِتَابُنَا = our book"},
        {suffix:"ـكُمْ",meaning:"your (m pl)",example:"كِتَابُكُمْ = your book"},
        {suffix:"ـهُمْ",meaning:"their (m)",example:"كِتَابُهُمْ = their book"}
      ];
      const pastSubject = [
        {suffix:"ـتُ",meaning:"I",example:"كَتَبْتُ = I wrote"},
        {suffix:"ـتَ",meaning:"you (m)",example:"كَتَبْتَ = you wrote"},
        {suffix:"ـتِ",meaning:"you (f)",example:"كَتَبْتِ = you wrote"},
        {suffix:"(none)",meaning:"he",example:"كَتَبَ = he wrote"},
        {suffix:"ـتْ",meaning:"she",example:"كَتَبَتْ = she wrote"},
        {suffix:"ـنَا",meaning:"we",example:"كَتَبْنَا = we wrote"},
        {suffix:"ـتُمْ",meaning:"you (m pl)",example:"كَتَبْتُمْ = you wrote"},
        {suffix:"ـنَ",meaning:"they (f)",example:"كَتَبْنَ = they wrote"}
      ];
      const card = el("div", {class:"card", style:"margin-bottom:16px"});
      card.append(el("h3", null, "📌 Suffix Reference Charts"));

      // Possessive suffixes
      card.append(el("h4", {style:"margin:16px 0 8px;color:var(--emerald-700)"}, "Possessive Pronouns (who owns what)"));
      const possGrid = el("div", {style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px"});
      possessive.forEach(p => {
        possGrid.append(el("div", {style:"display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--cream);border:1px solid var(--line)"},
          el("span", {class:"ar", style:"font-size:22px;min-width:60px;text-align:center"}, p.suffix),
          el("span", {style:"flex:1"}, el("b", null, p.meaning), el("br"), el("span", {style:"font-size:12px;color:var(--ink-soft)"}, p.example)),
          el("button", {class:"btn small ghost", style:"padding:2px 6px;font-size:12px",
            onclick: (e) => { e.stopPropagation(); Academy.speakArabic(p.example.split("=")[0].trim(), e.currentTarget); }
          }, "🔊")
        ));
      });
      card.append(possGrid);

      // Past tense subject suffixes
      card.append(el("h4", {style:"margin:16px 0 8px;color:var(--gold-500)"}, "Past Tense Subject Suffixes (who did it)"));
      const pastGrid = el("div", {style:"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px"});
      pastSubject.forEach(p => {
        const arText = p.example.split("=")[0].trim();
        pastGrid.append(el("div", {style:"display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--cream);border:1px solid var(--line)"},
          el("span", {class:"ar", style:"font-size:22px;min-width:60px;text-align:center"}, p.suffix),
          el("span", {style:"flex:1"}, el("b", null, p.meaning), el("br"), el("span", {style:"font-size:12px;color:var(--ink-soft)"}, p.example)),
          arText !== "(none)" ? el("button", {class:"btn small ghost", style:"padding:2px 6px;font-size:12px",
            onclick: (e) => { e.stopPropagation(); Academy.speakArabic(arText, e.currentTarget); }
          }, "🔊") : null
        ));
      });
      card.append(pastGrid);

      // Case endings
      card.append(el("h4", {style:"margin:16px 0 8px;color:var(--emerald-600)"}, "Case Endings (grammatical role)"));
      const cases = [
        {ending:"ـُ (damma)",role:"Nominative",use:"Subject",example:"الْوَلَدُ كَبِيرٌ"},
        {ending:"ـَ (fatha)",role:"Accusative",use:"Object",example:"رَأَيْتُ الْوَلَدَ"},
        {ending:"ـِ (kasra)",role:"Genitive",use:"After preposition",example:"فِي الْبَيْتِ"}
      ];
      const caseGrid = el("div", {style:"display:grid;grid-template-columns:repeat(3,1fr);gap:8px"});
      cases.forEach(c => {
        caseGrid.append(el("div", {style:"text-align:center;padding:12px;border-radius:10px;background:var(--cream);border:1px solid var(--line)"},
          el("div", {class:"ar", style:"font-size:20px"}, c.ending),
          el("div", {style:"font-weight:700;font-size:13px"}, c.role),
          el("div", {style:"font-size:11px;color:var(--ink-soft)"}, c.use),
          el("div", {class:"ar", style:"font-size:13px;color:var(--gold-500);margin-top:4px"}, c.example),
          el("button", {class:"btn small ghost", style:"margin-top:6px;padding:2px 6px;font-size:12px",
            onclick: (e) => { e.stopPropagation(); Academy.speakArabic(c.example, e.currentTarget); }
          }, "🔊 listen")
        ));
      });
      card.append(caseGrid);

      return card;
    }

    // quiz area
    const quizCard = el("div", {class:"card"});
    quizCard.append(el("h3", null, "Exercises"));
    const area = el("div");
    quizCard.append(area);
    view.append(quizCard);

    let idx = 0, correct = 0;
    const total = (L.drills || []).length;

    function renderDrill() {
      area.innerHTML = "";
      if (idx >= total) return finish();
      const d = L.drills[idx];
      const prog = el("div", {class:"progress-bar", style:"margin-bottom:14px"}, el("div", {style:"width:" + (idx/total*100) + "%"}));
      area.append(prog, el("p", {style:"color:var(--ink-soft);font-size:12px;margin:0 0 8px"}, "Exercise " + (idx+1) + " / " + total));
      if (d.type === "mc") renderMC(d); else renderMatch(d);
    }

    function renderMC(d) {
      const qEl = el("p", {class:"quiz-q"}, d.q);
      // If question contains Arabic text, add a listen button
      if (/[\u0600-\u06FF]/.test(d.q)) {
        area.append(el("div", {style:"display:flex;align-items:center;gap:8px"},
          qEl,
          el("button", {class:"btn small ghost", onclick: () => Academy.speakArabic(d.q.replace(/[^ا-ي\s]/g, "").trim())}, "🔊")
        ));
      } else {
        area.append(qEl);
      }
      const opts = d.options.map((o, i) => ({o, i}));
      Academy.shuffle(opts).forEach(({o, i}) => {
        const isAr = /[\u0600-\u06FF]/.test(o);
        area.append(el("button", {class:"quiz-opt", onclick:(e)=>{
          document.querySelectorAll("#lesson-view .quiz-opt").forEach(b=>b.disabled=true);
          if (i === d.answer) { e.currentTarget.classList.add("correct"); correct++; }
          else e.currentTarget.classList.add("wrong");
          setTimeout(()=>{ idx++; renderDrill(); }, 700);
        }}, isAr ? el("span", {class:"ar"}, o) : o));
      });
    }

    function renderMatch(d) {
      const left = Academy.shuffle(d.pairs.map(p => p[0]));
      const right = Academy.shuffle(d.pairs.map(p => p[1]));
      let pickedLeft = null, matched = 0;
      const gridEl = el("div", {class:"match-grid"});
      const status = el("p", {style:"font-size:13px;color:var(--ink-soft)"}, "Match Arabic to its meaning.");
      area.append(status, gridEl);
      left.forEach(lv => {
        const btn = el("div", {class:"match-item ar", onclick:()=>{
          gridEl.querySelectorAll(".match-item.ar").forEach(x=>x.classList.remove("picked"));
          btn.classList.add("picked"); pickedLeft = lv;
        }}, lv);
        gridEl.append(btn);
      });
      right.forEach(rv => {
        const btn = el("div", {class:"match-item", onclick:()=>{
          if (!pickedLeft) return;
          const pair = d.pairs.find(p => p[0] === pickedLeft && p[1] === rv);
          if (pair) {
            btn.classList.add("done");
            gridEl.querySelectorAll(".match-item.ar").forEach(x=>{
              if (x.textContent === pickedLeft) x.classList.add("done");
            });
            matched++; correct++; pickedLeft = null;
            if (matched === d.pairs.length) setTimeout(()=>{ idx++; renderDrill(); }, 500);
          } else {
            pickedLeft = null;
            gridEl.querySelectorAll(".match-item.ar").forEach(x=>x.classList.remove("picked"));
            btn.animate([{transform:"translateX(0)"},{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"translateX(0)"}],{duration:200});
          }
        }}, rv);
        gridEl.append(btn);
      });
    }

    function finish() {
      const pct = Math.round(correct / total * 100);
      Academy.completeLesson(L.id, pct);
      area.innerHTML = "";
      const passed = pct >= 70;
      area.append(
        el("div", {style:"text-align:center;padding:20px"},
          el("div", {style:"font-size:44px"}, passed ? "🎉" : "💪"),
          el("h3", null, pct + "% (" + correct + "/" + total + ") — " + (passed ? "Lesson complete!" : "Almost — try again")),
          el("p", {class:"sub"}, "+" + Math.round(20 + pct * 0.5) + " XP earned"),
          el("button", {class:"btn gold", onclick:()=>{ idx=0; correct=0; renderDrill(); }}, "Retry"),
          " ",
          el("button", {class:"btn ghost", onclick:()=>{view.innerHTML=""; list.style.display=""; renderList();}}, "Back to lessons"))
      );
    }
    renderDrill();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  renderList();
})();
</script>
</body>
</html>
